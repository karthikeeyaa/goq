info:
  name: Pull
  type: http
  seq: 1

http:
  method: GET
  url: "{{url}}/api/v1/pull/notifications/?offset=0&limit=30"
  params:
    - name: offset
      value: "0"
      type: query
    - name: limit
      value: "30"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
